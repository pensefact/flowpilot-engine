[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24
autorestart=true

[program:chromium]
command=chromium-browser --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --display=:99 --window-size=1280,720 --start-maximized
autorestart=true
environment=DISPLAY=":99"

[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared
autorestart=true

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
